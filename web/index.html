<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>飞行棋 · OTools 插件</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /*
     * OTools 宿主桥（插件唯一需要写的宿主 JS）。
     * ------------------------------------------------------------------
     * 宿主注入了两条能力通道，任一条通就算「在 OTools 里」：
     *   1. `window.otools` / `window.utools`：宿主包装 API（dialog.open/save + readHostFile/writeHostFile）。
     *   2. `window.__TAURI_INTERNALS__.invoke`：Tauri 原生 IPC（tools_webview_* 命令）。
     * 两条都不通（把 dist 拖进普通浏览器）就退回浏览器原生行为。
     *
     * 本插件用它导出对局记录（saveText → 宿主保存对话框）；宿主不可用时
     * 由 app.js 退回浏览器 Blob 下载。
     */
    (function () {
      function bytesToBase64(bytes) {
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }
      function baseName(p) {
        var s = String(p || '');
        var i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
        return i >= 0 ? s.slice(i + 1) : s;
      }

      function wrapper() {
        var a = (typeof window !== 'undefined' && (window.otools || window.utools)) || null;
        return a && a.dialog && typeof a.dialog.open === 'function' && typeof a.readHostFile === 'function' ? a : null;
      }
      function tauriInvoke() {
        var candidates = [window];
        try { if (window.parent && window.parent !== window) candidates.push(window.parent); } catch (e) {}
        try { if (window.top && window.top !== window) candidates.push(window.top); } catch (e) {}
        for (var i = 0; i < candidates.length; i++) {
          var t = candidates[i] && candidates[i].__TAURI_INTERNALS__;
          if (t && typeof t.invoke === 'function') return t.invoke.bind(t);
        }
        return null;
      }
      function hostReady() { return !!wrapper() || !!tauriInvoke(); }
      function fail(msg) { return Promise.reject(new Error(msg)); }

      function writeHostFile(path, dataBase64) {
        var invoke = tauriInvoke();
        if (invoke) {
          return invoke('tools_webview_write_file', { request: { path: path, dataBase64: dataBase64 } }).catch(function (e) {
            var a = wrapper();
            if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
            throw e;
          });
        }
        var a = wrapper();
        if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
        return fail('OTools 宿主不可用');
      }
      function pickSavePath(defaultPath) {
        var a = wrapper();
        if (a) return a.dialog.save({ title: '保存文件', defaultPath: defaultPath, filters: [{ name: 'JSON', extensions: ['json'] }] }).then(function (p) {
          return (p && typeof p === 'string') ? p : (p && p.path ? p.path : null);
        });
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 保存对话框不可用');
        var sp = String(defaultPath || '').match(/^(.*[\\/])?([^\\/]+)$/);
        return invoke('tools_webview_pick_save_path', {
          options: { title: '保存文件', suggestedName: sp ? sp[2] : defaultPath, directory: sp ? sp[1].replace(/[\\/]+$/, '') : undefined, filters: [{ name: 'JSON', extensions: ['json'] }] },
        }).then(function (meta) { return meta ? (typeof meta === 'string' ? meta : (meta.path || null)); });
      }

      // 暴露给页面其它脚本的统一桥。
      window.otoolsPlugin = {
        available: function () { return hostReady(); },
        theme: function () {
          var cl = document.documentElement && document.documentElement.classList;
          if (!cl) return '';
          if (cl.contains('dark')) return 'dark';
          if (cl.contains('light')) return 'light';
          return '';
        },
        language: function () {
          try {
            return (window.__OTOOLS_LOCALE__ && window.__OTOOLS_LOCALE__.locale) ||
              (document.documentElement && document.documentElement.lang) ||
              (typeof navigator !== 'undefined' && navigator.language) || '';
          } catch (e) { return ''; }
        },
        saveText: function (name, text) {
          if (!hostReady()) return fail('OTools 保存对话框不可用');
          return pickSavePath(name).then(function (path) {
            if (!path) return null;
            return writeHostFile(path, bytesToBase64(new TextEncoder().encode(text))).then(function () { return path; });
          });
        },
      };
    })();
  </script>
</head>
<body>
  <!-- 开局设置 -->
  <section class="screen" id="screen-setup">
    <header class="setup-head">
      <h1>✈️ 飞行棋</h1>
      <p>2-4 人本机对弈 · 掷 6 起飞 · 跳格与飞线捷径 · 三大主题背景故事</p>
    </header>

    <div class="resume-banner" id="resumeBanner" hidden>
      <span id="resumeText"></span>
      <button id="btnResume" class="primary">继续对局</button>
      <button id="btnDiscard">放弃存档</button>
    </div>

    <div class="theme-cards" id="themeCards"></div>

    <div class="setup-panel">
      <h2>座位配置</h2>
      <div class="seat-rows" id="seatRows"></div>
      <div class="setup-options">
        <label>电脑难度：
          <select id="levelSelect">
            <option value="easy">简单</option>
            <option value="normal" selected>普通</option>
            <option value="hard">困难</option>
          </select>
        </label>
        <span>规则：掷 6 才能起飞并奖励再掷；同色格连跳 +4；虚线飞线 +12；撞机返回机库。</span>
      </div>
      <div class="setup-actions">
        <button id="btnStart" class="primary">开始对局</button>
      </div>
      <p class="setup-error" id="setupError"></p>
    </div>
  </section>

  <!-- 对局 -->
  <section class="screen" id="screen-game">
    <main class="game-main">
      <div class="board-wrap" id="boardWrap"></div>
    </main>
    <aside class="game-panel">
      <div class="turn-card">
        <span class="turn-dot" id="turnDot"></span>
        <div>
          <div class="turn-name" id="turnName">—</div>
          <div class="turn-sub" id="turnSub"></div>
        </div>
      </div>
      <div class="dice-zone">
        <div class="dice" id="diceFace">✈</div>
        <button id="btnRoll" class="primary">掷骰</button>
        <div class="dice-hint" id="diceHint">轮到你了，掷骰出发！</div>
      </div>
      <div class="status-line" id="statusLine"></div>
      <div class="seat-progress" id="seatProgress"></div>
      <div class="log-box" id="logBox" aria-label="事件日志"></div>
      <div class="game-actions">
        <button id="btnExport">导出对局</button>
        <button id="btnRestart">重新开局</button>
        <button id="btnBackSetup">返回设置</button>
      </div>
    </aside>
  </section>

  <!-- 结算 -->
  <section class="screen" id="screen-result">
    <div class="result-card">
      <h1 id="resultTitle">对局结束</h1>
      <p class="result-sub" id="resultSub"></p>
      <div class="rank-list" id="rankList"></div>
      <div class="result-actions">
        <button id="btnAgain" class="primary">再来一局</button>
        <button id="btnToSetup">返回设置</button>
      </div>
    </div>
  </section>

  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
